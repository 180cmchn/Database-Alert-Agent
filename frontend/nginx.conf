server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Resolve the API through Docker's embedded DNS at request time. This lets
    # Nginx serve the static shell before Compose has created the API container.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $database_alert_api api:8000;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://$database_alert_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://$database_alert_api;
        proxy_set_header Host $host;
    }

    # Keep the frontend container health independent from the backend readiness.
    # The UI can serve its static shell as soon as Nginx starts, while API
    # requests continue to use the proxied `/health/live` and `/health/ready`.
    location = /health/frontend {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
