services:
  redis:
    image: redis:7.4.2-alpine
    hostname: redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        password_hash="$$(printf '%s' "$$REDIS_PASSWORD" | sha256sum | cut -d ' ' -f 1)"
        umask 077
        printf '%s\n' \
          'user default off' \
          "user database-alert-agent on #$$password_hash ~{database-alert-agent}:* resetchannels -@all +ping +eval +xadd +xgroup +xreadgroup +xautoclaim +xack +xdel +xpending +xinfo +del" \
          > /data/users.acl
        exec redis-server --appendonly yes --appendfsync everysec \
          --maxmemory-policy noeviction --aclfile /data/users.acl
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning --user database-alert-agent ping'
      interval: 3s
      timeout: 5s
      retries: 10

  migrate:
    image: database-alert-agent-backend:local
    restart: "no"
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/alerts.db}
      RUNTIME_SETTINGS_PATH: /app/data/runtime-settings.json
      MCP_SETTINGS_PATH: /app/config/mcp/settings.json
    volumes:
      - ./data:/app/data
    command: ["alembic", "upgrade", "head"]

  api:
    # Build once; migrate and worker reuse this local backend image.
    image: database-alert-agent-backend:local
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/alerts.db}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: database-alert-agent
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      HTTP_SCHEDULER: redis
      SCHEDULER_WORKERS: ${SCHEDULER_WORKERS:-1}
      RUNTIME_SETTINGS_PATH: /app/data/runtime-settings.json
      MCP_SETTINGS_PATH: /app/config/mcp/settings.json
      RESET_RUNTIME_SETTINGS_ON_START: "true"
      EXTERNAL_KNOWLEDGE_BASE_URL: ${EXTERNAL_KNOWLEDGE_BASE_URL:-http://knowledge:8000}
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - ./data:/app/data
    ports:
      # Keep the unauthenticated alert/read API on the local host. Route remote
      # alert platforms and operators through an authenticated gateway.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    image: database-alert-agent-backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.workers.redis"]
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/alerts.db}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: database-alert-agent
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SCHEDULER_WORKERS: ${SCHEDULER_WORKERS:-1}
      RUNTIME_SETTINGS_PATH: /app/data/runtime-settings.json
      MCP_SETTINGS_PATH: /app/config/mcp/settings.json
      RESET_RUNTIME_SETTINGS_ON_START: "true"
      EXTERNAL_KNOWLEDGE_BASE_URL: ${EXTERNAL_KNOWLEDGE_BASE_URL:-http://knowledge:8000}
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    # The static application can be served before the API is available. This
    # removes the Redis -> migrate -> API critical path from UI startup; API
    # requests become available once the backend completes its own safeguards.

volumes:
  redis-data:

